# Local development / single-host production stack for the Infinia Store
# Platform (design §4 "Cloud" plane).
#
# Dependency plane (default):   docker compose up -d
# Application plane (opt-in):   docker compose --profile app up -d
#
# The application plane runs the store under the `prod` Spring profile against
# this stack's PostgreSQL and MinIO. Copy .env.example to .env and fill in the
# STORE_* secrets first — ProductionHardeningCheck aborts startup on the
# dev-only defaults, so the app cannot silently boot with public credentials.
#
# TLS/WAF termination is out of scope by design: the store and monitor publish
# on loopback only and are expected behind a dedicated reverse proxy / WAF
# (see DEPLOYMENT.md for the SafeLine setup).

# Docker's json-file log driver has no rotation by default; without these a
# chatty app eventually fills the host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-default-limits: &default-limits
  deploy:
    resources:
      limits:
        # Env-tunable so operators can size for their host; these defaults fit
        # a modest single-box deployment alongside the proxy/WAF.
        cpus: "${DOCKER_CPUS_LIMIT:-2}"
        memory: "${DOCKER_MEM_LIMIT:-1g}"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-store}
      POSTGRES_USER: ${POSTGRES_USER:-store}
      # Dev default is fine while the port stays loopback-bound; any real
      # deployment overrides it in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-store}
    ports:
      # Loopback-only: these ports carry the stack's credentials and must not
      # be reachable from the LAN on laptop deployments.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-store} -d ${POSTGRES_DB:-store}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    <<: *default-limits

  # Reserved by the platform design (§3.5: cache, rate limiting, one-time
  # state) but not yet wired into the application — it ships with the stack so
  # the dependency plane matches the documented architecture.
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    <<: *default-limits

  # Official MinIO images are discontinued upstream (CVE-2025-62506 fixed only
  # in source); this is the final published tag, so at least it cannot drift.
  # Re-evaluate on the production host (`docker manifest inspect`) — see
  # DEPLOYMENT.md.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-store}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-store-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    <<: *default-limits

  # One-shot: creates the bucket the store's S3 storage mode expects, so
  # `store.storage.type=s3` works against this stack without manual steps.
  minio-init:
    # Frozen upstream like minio/minio; `latest` no longer drifts.
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    # Compose-time interpolation (same source as the minio service's env), so
    # the alias always carries the credentials MinIO actually booted with.
    entrypoint: >
      /bin/sh -c "
      mc alias set store http://minio:9000 ${MINIO_ROOT_USER:-store} ${MINIO_ROOT_PASSWORD:-store-secret} &&
      mc mb --ignore-existing store/store-blobs"
    logging: *default-logging

  # The store itself, built from the repo Dockerfile. Opt-in via
  # `docker compose --profile app up -d store` so the plain
  # `docker compose up -d` dependency-stack behaviour is unchanged.
  store:
    build: .
    image: infinia-store
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # prod profile: real datasource below + ProductionHardeningCheck rejects
      # the dev-only secrets, so this service cannot boot with public defaults.
      SPRING_PROFILES_ACTIVE: prod
      STORE_BASE_URL: ${STORE_BASE_URL:-http://localhost:8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-store}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-store}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-store}
      STORE_STORAGE_TYPE: s3
      STORE_STORAGE_S3_ENDPOINT: http://minio:9000
      STORE_STORAGE_S3_BUCKET: store-blobs
      STORE_STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-store}
      STORE_STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-store-secret}
      STORE_TICKET_SECRET: ${STORE_TICKET_SECRET:?set in .env — ProductionHardeningCheck refuses the dev default}
      STORE_ROLLOUT_SECRET: ${STORE_ROLLOUT_SECRET:?set in .env — ProductionHardeningCheck refuses the dev default}
      STORE_CLI_CLIENT_SECRET: ${STORE_CLI_CLIENT_SECRET:?set in .env — ProductionHardeningCheck refuses the dev default}
    ports:
      # Loopback-only; publish through the reverse proxy / WAF, never directly.
      - "127.0.0.1:8080:8080"
    volumes:
      - storedata:/var/lib/infinia-store
    restart: unless-stopped
    logging: *default-logging
    <<: *default-limits

  # Standalone status monitor (ADR-011), built from Dockerfile.monitor. Same
  # app profile as the store. Its API and page are anonymous BY DESIGN
  # (ADR-011) — published through the reverse proxy / WAF, which provides
  # CC protection; loopback-only here so it is never reachable directly.
  monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    image: infinia-monitor
    profiles: ["app"]
    depends_on:
      store:
        condition: service_healthy
    environment:
      # Default probes the store inside the compose network; set the store's
      # PUBLIC https:// URL in .env to measure true external reachability
      # through the proxy/WAF instead.
      MONITOR_TARGET_BASE_URL: ${MONITOR_TARGET_BASE_URL:-http://store:8080}
      MONITOR_ALERT_WEBHOOK: ${MONITOR_ALERT_WEBHOOK:-}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - monitordata:/var/lib/infinia-monitor
    restart: unless-stopped
    logging: *default-logging
    <<: *default-limits

volumes:
  pgdata:
  miniodata:
  storedata:
  monitordata:
