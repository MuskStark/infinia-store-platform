spring:
  application:
    name: infinia-store
  datasource:
    url: jdbc:postgresql://localhost:5432/store
    username: store
    password: store
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  messages:
    basename: i18n/errors
  web:
    resources:
      add-mappings: true

server:
  port: 8080
  # Behind the reverse proxy / WAF (SafeLine terminates TLS): Tomcat's
  # RemoteIpValve rewrites getRemoteAddr() from X-Forwarded-For, but ONLY
  # when the peer itself is a trusted internal proxy (internal-proxies
  # defaults cover loopback plus all private ranges) — spoofed XFF from a
  # client outside that chain is ignored, so per-IP rate limiting stays
  # meaningful.
  forward-headers-strategy: native
  error:
    include-problem-details: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      # The status page's http-quality probe reads the published p95 percentile.
      percentiles:
        http.server.requests: 0.95

store:
  app-coordinate: ${STORE_APP_COORDINATE:infinia://app/official/fengyu-host}
  base-url: http://localhost:8080
  # Absolute by default: a relative path silently splits blob storage across
  # working directories, and LocalFsBlobStorage refuses it at boot anyway.
  blob-dir: ${user.home}/.infinia-store/blobs
  # Same working-directory rule as blob-dir (enforced in StoreProperties).
  key-dir: ${user.home}/.infinia-store/keys
  # Artifact plane (design §5.1): local filesystem by default, or point type at
  # s3 to keep uploaded artifacts in one S3-compatible bucket (MinIO, AWS S3,
  # any SigV4 endpoint). Blob keys are content addresses either way, so the
  # database is portable between backends; only the bytes move.
  storage:
    type: ${STORE_STORAGE_TYPE:local}
    s3:
      endpoint: ${STORE_STORAGE_S3_ENDPOINT:}
      region: ${STORE_STORAGE_S3_REGION:}
      bucket: ${STORE_STORAGE_S3_BUCKET:}
      access-key: ${STORE_STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORE_STORAGE_S3_SECRET_KEY:}
      # null = auto: path-style for custom endpoints (MinIO), virtual-hosted for AWS.
      path-style-access: ${STORE_STORAGE_S3_PATH_STYLE:}
      key-prefix: ${STORE_STORAGE_S3_KEY_PREFIX:}
  ticket-secret: ${STORE_TICKET_SECRET:dev-only-ticket-secret-change-me}
  rollout-secret: ${STORE_ROLLOUT_SECRET:dev-only-rollout-secret-change-me}
  # Infinia Level purchase (会员等级购买): orders close after their payment
  # window; the closing job's interval is property-driven so tests can pin it
  # far in the future and drive closeExpiredOrders() by hand. Gateway
  # credentials live under store.pay.bmac/epay/xunhu.* — PaymentGatewayConfig
  # picks the first configured one; unset means the purchase flow reports
  # payment_not_configured and nothing else changes.
  pay:
    order-expire-minutes: ${STORE_PAY_ORDER_EXPIRE_MINUTES:30}
    order-close-interval-ms: ${STORE_PAY_ORDER_CLOSE_INTERVAL_MS:60000}
    # Local-only simulated cashier (also requires the local profile;
    # production can never enable it).
    mock-enabled: ${STORE_PAY_MOCK_ENABLED:false}
    # Buy Me a Coffee — free to start (BMAC keeps 5%); buyers pay on the
    # creator page and the webhook matches by supporter email + amount, so
    # plans price in the creator currency's cents and each plan should link a
    # priced Extra (membership_plan.external_url).
    bmac:
      page-url: ${STORE_PAY_BMAC_PAGE_URL:}
      webhook-secret: ${STORE_PAY_BMAC_WEBHOOK_SECRET:}
      # How long a pending order stays matchable to an incoming payment.
      match-window-minutes: ${STORE_PAY_BMAC_MATCH_WINDOW_MINUTES:1440}
    # Epay protocol (易支付协议): self-hosted V免付 / 彩虹易支付 or any
    # compatible provider — the zero-fee domestic option. One pid/key pair
    # serves both channels.
    epay:
      api-base: ${STORE_PAY_EPAY_API_BASE:}
      pid: ${STORE_PAY_EPAY_PID:}
      key: ${STORE_PAY_EPAY_KEY:}
    # XunHuPay (虎皮椒) — personal WeChat/Alipay channel (account-opening fee
    # applies on the platform). WeChat and Alipay are separate apps there.
    xunhu:
      api-base: ${STORE_PAY_XUNHU_API_BASE:https://api.xunhupay.com}
      wechat-appid: ${STORE_PAY_XUNHU_WECHAT_APPID:}
      wechat-appsecret: ${STORE_PAY_XUNHU_WECHAT_APPSECRET:}
      alipay-appid: ${STORE_PAY_XUNHU_ALIPAY_APPID:}
      alipay-appsecret: ${STORE_PAY_XUNHU_ALIPAY_APPSECRET:}
  max-upload-bytes: 1073741824
  download-ticket-ttl-seconds: 300
  upload-ticket-ttl-seconds: 900
  # web-redirect-uri / allowed-origins are unset on purpose: the SPA ships inside
  # the jar and shares this origin, so defaults derive from store.base-url.
  desktop-redirect-uris: http://127.0.0.1:24057/callback,http://localhost:24057/callback
  # fengyu-desktop is a PUBLIC OAuth client (RFC 8252 §8.5): PKCE only, no secret.
  cli-client-id: ${STORE_CLI_CLIENT_ID:store-cli}
  cli-client-secret: ${STORE_CLI_CLIENT_SECRET:dev-only-cli-secret}
  # Default upstream sources seeded on first boot and indexed from then on
  # (aggregation stays metadata-only; payloads materialize per download).
  # Note: indexing needs the seeded ci/reviewer accounts, so a deployment with
  # store.seed.enabled=false records a clear sync error until accounts exist.
  upstream:
    defaults:
      enabled: ${STORE_UPSTREAM_DEFAULTS_ENABLED:true}
      skillhub-url: ${STORE_UPSTREAM_SKILLHUB_URL:https://api.skillhub.cn/api/skills?pages=1}
      # Indexing publishes through internal machine accounts (ci/reviewer);
      # the first sync provisions them credential-less if seeding did not
      # (production seeds nothing — see UpstreamSyncService#internalAccount).
  # Comprehensive-monitoring probe thresholds; the standalone monitor mirrors
  # these indicators, it never re-derives them.
  monitoring:
    disk-warn-free-percent: ${STORE_MONITOR_DISK_WARN_PERCENT:15}
    disk-critical-free-percent: ${STORE_MONITOR_DISK_CRITICAL_PERCENT:5}
    memory-warn-free-percent: ${STORE_MONITOR_MEMORY_WARN_PERCENT:10}
    memory-critical-free-percent: ${STORE_MONITOR_MEMORY_CRITICAL_PERCENT:3}
    heap-warn-used-percent: ${STORE_MONITOR_HEAP_WARN_PERCENT:85}
    pool-warn-active-percent: ${STORE_MONITOR_POOL_WARN_PERCENT:80}
    pool-awaiting-outage-threads: ${STORE_MONITOR_POOL_AWAITING_OUTAGE:5}
    http-5xx-warn-percent: ${STORE_MONITOR_HTTP_5XX_WARN_PERCENT:1.0}
    http-5xx-critical-percent: ${STORE_MONITOR_HTTP_5XX_CRITICAL_PERCENT:5.0}
    http-p95-warn-millis: ${STORE_MONITOR_HTTP_P95_WARN_MS:1500}

---
spring:
  config:
    activate:
      on-profile: local,dev
store:
  seed:
    demo-content: false
    # Demo monitoring history: sprinkle degraded/outage/no-data days into the
    # 90-day comb so the status page shows every state it can render.
    status-history: true
---
# H2 profile for local runs without Docker: `--spring.profiles.active=local`.
# Database, blobs, keys and git exports all live under the project root's
# git-ignored tmp/ folder (DataDirEnvironmentPostProcessor resolves it from the
# working directory, so IDEA runs from the project root and Maven runs from the
# module dir land on the same files; STORE_DATA_DIR overrides everything).
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:${store.data-dir}/storedb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

---
# Single-jar production run without Docker: `--spring.profiles.active=prod`.
# NOTE: the embedded H2 fallback below requires EXPLICIT acknowledgment —
# ProductionHardeningCheck refuses to boot on it unless STORE_ALLOW_EMBEDDED_H2=true
# or spring.datasource.url points at a real database (audit P2-5). Container
# deployments keep PostgreSQL — the compose stack overrides spring.datasource.*
# wholesale.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${STORE_DB_URL:jdbc:h2:file:${store.data-dir}/storedb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${STORE_DB_USERNAME:sa}
    password: ${STORE_DB_PASSWORD:}
  # No dialect pin: Hibernate resolves it from the JDBC connection, so the
  # same profile boots against both the H2 fallback and a real PostgreSQL
  # (compose overrides spring.datasource.* wholesale).

---
# Split-origin development / test: Store Web runs as a separate Vite origin
# (:8089 dev server, :4173 preview) proxying /api and /oauth2 to this backend.
spring:
  config:
    activate:
      on-profile: dev,test
store:
  allowed-origins: http://localhost:8089,http://localhost:4173
  web-redirect-uri: http://localhost:8089/callback

---
# Seeds local/test accounts; demo catalog fixtures remain opt-in.
spring:
  config:
    activate:
      on-profile: local,dev,test
store:
  seed:
    enabled: true
