spring.datasource.url=jdbc:h2:mem:store;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
store.blob-dir=${java.io.tmpdir}/infinia-store-test/blobs
store.key-dir=${java.io.tmpdir}/infinia-store-test/keys
store.base-url=http://localhost:${server.port}
store.seed.enabled=true
store.seed.demo-content=true
logging.level.org.springframework.security=INFO
store.export-dir=target/test-git-exports
store.upstream.allow-internal=true
store.upstream.defaults.enabled=false
store.remote-datasource-file=${java.io.tmpdir}/infinia-store-test/remote-datasource.properties
# Host thresholds depend on the machine running the tests (a dev laptop with
# 2% "free" RAM after OS caching is healthy); keep the structural assertions
# independent of the host's actual memory/disk headroom.
store.monitoring.memory-warn-free-percent=0
store.monitoring.memory-critical-free-percent=0
store.monitoring.disk-warn-free-percent=0
store.monitoring.disk-critical-free-percent=0
# Same reasoning for the runner-load-dependent probes: suite-time heap pressure
# trips the 85% warn line on a 2-core CI runner, and the http-quality p95 is
# cumulative over all real-server requests — including this page's own probe
# time — so a slow runner flags it degraded. Neutralized (>100% / 24h p95)
# keeps the structural assertions honest about shape, not host speed.
store.monitoring.heap-warn-used-percent=101
store.monitoring.pool-warn-active-percent=101
store.monitoring.pool-awaiting-outage-threads=1000
store.monitoring.http-p95-warn-millis=86400000
store.monitoring.http-5xx-warn-percent=101
store.monitoring.http-5xx-critical-percent=101
