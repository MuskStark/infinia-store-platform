spring.datasource.url=jdbc:h2:mem:store;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
store.blob-dir=${java.io.tmpdir}/infinia-store-test/blobs
store.key-dir=${java.io.tmpdir}/infinia-store-test/keys
store.base-url=http://localhost:${server.port}
store.seed.enabled=true
store.seed.demo-content=true
logging.level.org.springframework.security=INFO
store.export-dir=target/test-git-exports
store.upstream.allow-internal=true
store.app-minimum-supported-version=3.9.0
store.remote-datasource-file=${java.io.tmpdir}/infinia-store-test/remote-datasource.properties
