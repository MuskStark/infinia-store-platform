openapi: 3.1.0
info:
  title: Infinia Store Platform API
  version: 1.0.0
  summary: Catalog, publishing, review and delivery API for the Infinia / FengYu ecosystem.
  description: |
    Versioned REST API of the Infinia Store Platform (design §10).

    * Root path `/api/v1`; breaking changes ship as `/api/v2` — never via headers.
    * JSON is camelCase, timestamps are UTC RFC 3339, identifiers are UUIDv7/ULID.
    * Errors use `application/problem+json` with a stable `code`, `traceId` and
      localizable arguments.
    * Lists use cursor pagination; write endpoints accept `Idempotency-Key`;
      concurrent updates use `ETag/If-Match`.
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.txt
servers:
  - url: /api/v1
security:
  - bearerAuth: []

tags:
  - name: Catalog
  - name: Listings
  - name: Resolution
  - name: Delivery
  - name: Updates
  - name: Account
  - name: Library
  - name: Telemetry
  - name: Publisher
  - name: Review
  - name: Organizations
  - name: Moderation
  - name: Admin
  - name: Compatibility
  - name: Blobs

paths:
  /catalog:
    get:
      operationId: browseCatalog
      tags: [Catalog]
      summary: Browse the public catalog (anonymous access allowed)
      security:
        - {}
        - bearerAuth: []
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ListingType' } }
        - { name: query, in: query, schema: { type: string, maxLength: 128 }, description: Free-text search over name, summary and tags }
        - { name: category, in: query, schema: { type: string } }
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/Channel' } }
        - { name: hostVersion, in: query, schema: { type: string }, description: Only listings with a compatible release }
        - { name: os, in: query, schema: { $ref: '#/components/schemas/Platform' } }
        - { name: arch, in: query, schema: { $ref: '#/components/schemas/Arch' } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, recent, downloads, favorites], default: relevance } }
        - { name: featured, in: query, schema: { type: boolean }, description: Editorial featured shelf only }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
      responses:
        '200':
          description: Catalog page
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPage' }

  /listings/{namespace}/{slug}:
    get:
      operationId: getListing
      tags: [Listings]
      summary: Listing detail with visible releases
      security:
        - {}
        - bearerAuth: []
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/Channel' } }
      responses:
        '200':
          description: Listing detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingDetail' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /listings/{namespace}/{slug}/ratings:
    get:
      operationId: listRatings
      tags: [Listings]
      summary: Ratings and average score of a listing (anonymous access allowed)
      security:
        - {}
        - bearerAuth: []
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Ratings page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatingsPage' }
    put:
      operationId: upsertRating
      tags: [Moderation]
      summary: Create or update the caller's rating (one per user per listing)
      security:
        - bearerAuth: []
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertRatingRequest' }
      responses:
        '200':
          description: Stored rating
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rating' }

  /reports:
    post:
      operationId: reportListing
      tags: [Moderation]
      summary: Report a listing for abuse / policy violation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportRequest' }
      responses:
        '201':
          description: Report filed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '409': { $ref: '#/components/responses/ProblemConflict' }

  /resolutions:
    post:
      operationId: resolve
      tags: [Resolution]
      summary: Resolve versions and dependency closure for a client environment
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveRequest' }
      responses:
        '200':
          description: Resolution plan (resolvable=false when dependencies are missing)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolveResponse' }

  /releases/{releaseId}/install-manifest:
    get:
      operationId: getInstallManifest
      tags: [Delivery]
      summary: FengYu Native install manifest (aggregation plan §7.1) — signed artifact + install mode
      description: |
        Schema-versioned install contract for the host's SkillInstaller /
        McpInstaller. MCP installs always default to disabled with secrets
        kept local; compatibility surfaces are never a separate trust root.
      security:
        - {}
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
        - { name: client, in: query, schema: { type: string, default: fengyu } }
      responses:
        '200':
          description: Install manifest
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemaVersion: { type: integer }
                  coordinate: { type: string }
                  type: { type: string }
                  sourceReleaseId: { type: string }
                  artifact:
                    type: object
                    properties:
                      url: { type: string, format: uri }
                      sha256: { type: string }
                      signature: { type: string }
                      keyId: { type: string }
                      size: { type: integer, format: int64 }
                  dependencies:
                    type: array
                    items:
                      type: object
                      properties:
                        coordinate: { type: string }
                        range: { type: string }
                        optional: { type: boolean }
                  permissions:
                    type: array
                    items: { $ref: '#/components/schemas/Permission' }
                  install:
                    type: object
                    properties:
                      mode: { type: string, enum: [SKILL_DIRECTORY, MCP_TEMPLATE, PLUGIN_PACKAGE] }
                      defaultEnabled: { type: boolean }
                      secretsPolicy: { type: string }
                  resolvedAt: { type: string, format: date-time }
        '409': { description: Release not installable }

  /compat/fengyu/mcp-catalog:
    get:
      operationId: fengyuMcpCatalog
      tags: [Compatibility]
      summary: Legacy-shape MCP catalog with direct template downloads
      security:
        - {}
      responses:
        '200':
          description: MCP catalog entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    description: { type: string }
                    version: { type: string }
                    author: { type: string }
                    downloadUrl: { type: string, description: Direct HMAC-ticketed template URL }
                    sha256: { type: string }
                    transport: { type: string }
                    official: { type: boolean }

  /compat/fengyu/codex/catalog:
    get:
      operationId: fengyuCodexCatalog
      tags: [Compatibility]
      summary: Codex-consumable skill catalog pointing at native manifests
      security:
        - {}
      responses:
        '200':
          description: Codex catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemaVersion: { type: integer }
                  generator: { type: string }
                  skills:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        skillId: { type: string }
                        version: { type: string }
                        listing: { type: string }
                        installManifest: { type: string }

  /compat/fengyu/claude-marketplace.json:
    get:
      operationId: claudeEcosystemMarketplace
      tags: [Compatibility]
      summary: CLAUDE-ecosystem marketplace exporting skills and MCP templates as git sources
      description: |
        Each published SKILL/MCP listing is materialized as a small local git
        repository carrying a .claude-plugin/plugin.json (skills paths and an
        mcpServers block). Registering this URL as a CLAUDE-type source in the
        FengYu host installs skills and disabled MCP server definitions through
        the host's existing ecosystem installer; re-cloning picks up updates.
      security:
        - {}
      responses:
        '200':
          description: Claude marketplace document
          content:
            application/json:
              schema:
                type: object
                properties:
                  plugins:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        description: { type: string }
                        category: { type: string }
                        keywords: { type: array, items: { type: string } }
                        author:
                          type: object
                          properties:
                            name: { type: string }
                        source:
                          type: object
                          properties:
                            source: { type: string, enum: [url] }
                            url: { type: string, description: file:// clone URL }

  /compat/fengyu/skills-catalog:
    get:
      operationId: fengyuSkillsCatalog
      tags: [Compatibility]
      summary: SkillCatalogEntry-compatible skill catalog (fengyu.skills.catalog-url)
      security:
        - {}
      responses:
        '200':
          description: Legacy skill catalog entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    description: { type: string }
                    version: { type: string }
                    author: { type: string }
                    downloadUrl: { type: string }
                    official: { type: boolean }

  /compat/fengyu/fengyu-releases/api/releases/latest:
    get:
      operationId: fengyuPortableReleaseMirror
      tags: [Compatibility]
      summary: GitHub-releases-compatible mirror for the Electron portable updater
      description: Consumed via the host's updateApiBase setting ({base}/fengyu-releases/api/releases/latest).
      security:
        - {}
      parameters:
        - { name: channel, in: query, schema: { type: string } }
      responses:
        '200':
          description: GitHub-compatible release object, or [] when no stable APP release exists
          content:
            application/json:
              schema: {}

  /compat/fengyu/catalog:
    get:
      operationId: fengyuCompatCatalog
      tags: [Compatibility]
      summary: MarketplaceCatalogEntry-compatible plugin catalog for the FengYu host store
      description: |
        Serves the JSON array contract the FengYu host's built-in FENGYU marketplace
        source type fetches, so the host lists, updates and downloads plugins with
        zero code changes. Each entry carries the latest published version and a
        direct HMAC-ticketed downloadUrl for the package artifact.
      security:
        - {}
      responses:
        '200':
          description: Legacy catalog entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FengYuCatalogEntry' }

  /releases/{releaseId}/download-ticket:
    post:
      operationId: createDownloadTicket
      tags: [Delivery]
      summary: Mint a short-lived, purpose-limited CDN download ticket
      security:
        - {}
        - bearerAuth: []
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
        - { name: artifactId, in: query, schema: { type: string }, description: Select a specific artifact; defaults to the best platform match }
      responses:
        '200':
          description: Ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadTicket' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }

  /releases/{releaseId}/checksums.txt:
    get:
      operationId: releaseChecksums
      tags: [Delivery]
      summary: sha256sum-style checksum manifest of a published release's binary artifacts (design §8.3)
      security:
        - {}
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 'One `<sha256>  <filename>` line per INSTALLER / PORTABLE / PACKAGE artifact, sorted by filename'
          content:
            text/plain:
              schema: { type: string }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
        '409': { $ref: '#/components/responses/ProblemConflict' }

  /updates/app:
    get:
      operationId: appUpdateFeed
      tags: [Updates]
      summary: Signed app update feed (design §8.4)
      security:
        - {}
      parameters:
        - { name: current, in: query, required: true, schema: { type: string } }
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/Channel' }, default: stable }
        - { name: os, in: query, required: true, schema: { $ref: '#/components/schemas/Platform' } }
        - { name: arch, in: query, required: true, schema: { $ref: '#/components/schemas/Arch' } }
        - { name: mode, in: query, schema: { type: string, enum: [installer, portable, any] }, description: Select installed or portable application distributions }
        - { name: variant, in: query, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,31}$' }, description: Build variant such as lite, jre, uos or jar }
        - { name: installId, in: query, required: true, schema: { type: string }, description: Opaque random id used for stable rollout bucketing }
      responses:
        '200':
          description: Update feed entry; latestVersion=null when up to date
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppUpdate' }

  /auth/register:
    post:
      operationId: register
      tags: [Account]
      summary: Register a store account
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUser' }
        '409': { $ref: '#/components/responses/ProblemConflict' }

  /auth/login:
    post:
      operationId: login
      tags: [Account]
      summary: Direct email + password login; returns an access token and registers a revocable session
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Access token with current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }

  /me:
    get:
      operationId: getCurrentUser
      tags: [Account]
      summary: Current authenticated principal
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUser' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }
    put:
      operationId: updateCurrentUser
      tags: [Account]
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUser' }

  /me/password:
    put:
      operationId: changePassword
      tags: [Account]
      summary: Change password after re-authenticating with the current one
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangePasswordResult' }
        '401': { $ref: '#/components/responses/ProblemUnauthorized' }

  /me/sessions:
    get:
      operationId: listSessions
      tags: [Account]
      summary: Active sessions and grants
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }

  /me/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      tags: [Account]
      summary: Revoke a session or grant
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Revoked }

  /me/devices:
    get:
      operationId: listDevices
      tags: [Account]
      summary: Registered host devices
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }

  /me/devices/{deviceId}:
    delete:
      operationId: revokeDevice
      tags: [Account]
      summary: Revoke a device (refresh tokens issued to it become invalid immediately)
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Revoked }

  /me/library:
    get:
      operationId: getLibrary
      tags: [Library]
      summary: Favorites, entitlements and install history
      responses:
        '200':
          description: Library
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }

  /me/installed:
    get:
      operationId: listInstalled
      tags: [Library]
      summary: Installed listings derived from install telemetry (hint, not truth — ADR-009)
      responses:
        '200':
          description: Installed items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InstalledItem' }

  /me/updates:
    get:
      operationId: listUpdates
      tags: [Library]
      summary: Installed listings with a newer published release
      responses:
        '200':
          description: Updatable items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InstalledItem' }

  /me/favorites/{listingId}:
    put:
      operationId: addFavorite
      tags: [Library]
      summary: Favorite a listing
      parameters:
        - { name: listingId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Favorited }
    delete:
      operationId: removeFavorite
      tags: [Library]
      summary: Remove a favorite
      parameters:
        - { name: listingId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Removed }

  /install-events:
    post:
      operationId: reportInstallEvents
      tags: [Telemetry]
      summary: Report optional, idempotent install telemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/InstallEvent' }
      responses:
        '202': { description: Accepted }

  /publisher/listings:
    get:
      operationId: listPublisherListings
      tags: [Publisher]
      summary: Listings owned by the caller's namespaces
      responses:
        '200':
          description: Listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CatalogItem' }
    post:
      operationId: createListing
      tags: [Publisher]
      summary: Create a listing in a namespace the caller owns
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateListingRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingDetail' }
        '403': { $ref: '#/components/responses/ProblemForbidden' }
        '409': { $ref: '#/components/responses/ProblemConflict' }

  /publisher/listings/{listingId}/releases:
    get:
      operationId: listPublisherReleases
      tags: [Publisher]
      summary: All releases of a listing including DRAFTs, newest first
      description: >-
        Lets publisher tooling resume an interrupted draft (upload + submit)
        after a reload. Owner or platform admin only.
      parameters:
        - { name: listingId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Releases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublisherRelease' }
    post:
      operationId: createRelease
      tags: [Publisher]
      summary: Create a draft release
      parameters:
        - { name: listingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReleaseRequest' }
      responses:
        '201':
          description: Draft release created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublisherRelease' }

  /publisher/releases/{releaseId}/uploads:
    post:
      operationId: createUploadSession
      tags: [Publisher]
      summary: Create an upload session; returns a short-lived presigned PUT URL
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, kind]
              properties:
                filename: { type: string, maxLength: 255 }
                kind: { $ref: '#/components/schemas/ArtifactKind' }
                platform: { $ref: '#/components/schemas/Platform' }
                arch: { $ref: '#/components/schemas/Arch' }
                variant: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,31}$' }
                size: { type: integer, format: int64, minimum: 1 }
      responses:
        '201':
          description: Upload session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }

  /publisher/releases/{releaseId}/submit:
    post:
      operationId: submitRelease
      tags: [Publisher]
      summary: Submit a release for scanning and review
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        '202':
          description: Accepted for scanning
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmitResult' }

  /publisher/releases/{releaseId}:
    get:
      operationId: getPublisherRelease
      tags: [Publisher]
      summary: Release status including scan findings
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Release
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublisherRelease' }

  /publisher/releases/{releaseId}/yank:
    post:
      operationId: yankOwnRelease
      tags: [Publisher]
      summary: Self-withdraw one of the caller's published releases
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Yanked }
        '403': { $ref: '#/components/responses/ProblemForbidden' }

  /publisher/listings/{listingId}/min-bee-level:
    post:
      operationId: setOwnListingMinBeeLevel
      tags: [Publisher]
      summary: Publisher adjustment of the Infinia Level gate on an owned listing
      description: >-
        0 keeps the listing public (anonymous included); 1..4 restricts view and
        download to signed-in accounts at or above that hive level.
      security:
        - bearerAuth: []
      parameters:
        - { name: listingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minBeeLevel]
              properties:
                minBeeLevel: { type: integer, minimum: 0, maximum: 4 }
      responses:
        '200':
          description: Updated listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingDetail' }

  /reviews:
    get:
      operationId: listReviews
      tags: [Review]
      summary: Review queue (REVIEWER or PLATFORM_ADMIN)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [IN_REVIEW, APPROVED, REJECTED, CHANGES_REQUESTED] } }
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Review' }

  /reviews/{reviewId}/decisions:
    post:
      operationId: decideReview
      tags: [Review]
      summary: Record a review decision; APPROVE publishes and platform-signs the envelope
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT, REQUEST_CHANGES] }
                notes: { type: string, maxLength: 4000 }
      responses:
        '200':
          description: Updated review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }

  /admin/releases/{releaseId}/yank:
    post:
      operationId: yankRelease
      tags: [Review]
      summary: Yank (soft-withdraw) a published release — PLATFORM_ADMIN
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Yanked }

  /admin/releases/{releaseId}/quarantine:
    post:
      operationId: quarantineRelease
      tags: [Review]
      summary: Quarantine a release on a security event — PLATFORM_ADMIN
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Quarantined }

  /admin/app-releases:
    get:
      operationId: listAdminAppReleases
      tags: [Admin]
      summary: The conventional host listing's releases, newest first — PLATFORM_ADMIN
      description: |
        Manual-update bookkeeping for the intranet admin console (the store
        replaces the FY-Proxy distribution center).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Releases (drafts included); empty when nothing was uploaded yet
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminAppRelease' }
    post:
      operationId: startAdminAppUpload
      tags: [Admin]
      summary: Start a manual host-app update upload — PLATFORM_ADMIN
      description: |
        Ensures the conventional APP listing (store.app-coordinate), drafts the
        release and returns the presigned PUT URL for the package bytes (same
        ticketed pipeline as the publisher portal). Version and channel are
        inferred from the package filename when omitted.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAppUploadStart' }
      responses:
        '201':
          description: Upload session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAppUploadSession' }
    delete:
      operationId: deleteAdminAppRelease
      tags: [Admin]
      summary: Delete a manually uploaded release — PLATFORM_ADMIN
      description: |
        Hard-removes the release row (any status; removal supersedes a yank).
        The app update feed and the compat mirror stop serving it immediately.
      security:
        - bearerAuth: []
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }
        '404': { description: Unknown release }

  /admin/app-releases/{releaseId}/publish:
    post:
      operationId: publishAdminAppUpload
      tags: [Admin]
      summary: Publish a manually uploaded release immediately — PLATFORM_ADMIN
      description: |
        The platform admin is the review decision: the envelope and every
        artifact are platform-signed like an approval, with a distinct audit
        trail (release.admin-publish).
      security:
        - bearerAuth: []
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Published release
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAppRelease' }

  /admin/app-releases/{releaseId}/delete:
    post:
      operationId: deleteAdminAppUploadViaPost
      tags: [Admin]
      summary: Delete alias (POST form) — PLATFORM_ADMIN
      deprecated: true
      security:
        - bearerAuth: []
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }

  /admin/listings:
    get:
      operationId: listAllListings
      tags: [Admin]
      summary: Every listing with curation state — PLATFORM_ADMIN
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All listings regardless of visibility
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminListing' }

  /admin/listings/{listingId}/visibility:
    post:
      operationId: setListingVisibility
      tags: [Admin]
      summary: Delist (UNLISTED) or relist (PUBLIC) a listing — PLATFORM_ADMIN
      security:
        - bearerAuth: []
      parameters:
        - { name: listingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              properties:
                visibility: { type: string, enum: [PUBLIC, UNLISTED] }
      responses:
        '200':
          description: Updated listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminListing' }

  /admin/listings/{listingId}/featured:
    post:
      operationId: setListingFeatured
      tags: [Admin]
      summary: Toggle editorial featuring — PLATFORM_ADMIN
      security:
        - bearerAuth: []
      parameters:
        - { name: listingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [featured]
              properties:
                featured: { type: boolean }
      responses:
        '200':
          description: Updated listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminListing' }

  /admin/databases:
    get:
      operationId: listRemoteDatabases
      tags: [Admin]
      summary: Registered remote database endpoints — PLATFORM_ADMIN
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Connections (credentials never returned)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RemoteDatabase' }
    post:
      operationId: createRemoteDatabase
      tags: [Admin]
      summary: Register a remote database endpoint — PLATFORM_ADMIN
      description: >-
        Only jdbc:postgresql:// and jdbc:h2: URLs are accepted (the shipped
        drivers); H2 INIT/RUNSCRIPT parameters are rejected. The password is
        AES-GCM sealed at rest and never returned by the API.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRemoteDatabaseRequest' }
      responses:
        '201':
          description: Registered connection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteDatabase' }

  /admin/databases/status:
    get:
      operationId: dataSourceStatus
      tags: [Admin]
      summary: What the running instance is connected to right now — PLATFORM_ADMIN
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current data source (URL password-masked)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSourceStatus' }

  /admin/databases/{databaseId}:
    put:
      operationId: updateRemoteDatabase
      tags: [Admin]
      summary: Update a registered endpoint — PLATFORM_ADMIN
      description: A blank/absent password keeps the stored credential.
      security:
        - bearerAuth: []
      parameters:
        - { name: databaseId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRemoteDatabaseRequest' }
      responses:
        '200':
          description: Updated connection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteDatabase' }
    delete:
      operationId: deleteRemoteDatabase
      tags: [Admin]
      summary: Remove a registered endpoint — PLATFORM_ADMIN
      description: Deleting the active connection also drops the data-source override.
      security:
        - bearerAuth: []
      parameters:
        - { name: databaseId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Removed }

  /admin/databases/{databaseId}/test:
    post:
      operationId: testRemoteDatabase
      tags: [Admin]
      summary: Live connectivity probe (real JDBC connection) — PLATFORM_ADMIN
      security:
        - bearerAuth: []
      parameters:
        - { name: databaseId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Probe outcome incl. server product/version on success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteDatabaseTestResult' }

  /admin/databases/{databaseId}/activation:
    post:
      operationId: setRemoteDatabaseActivation
      tags: [Admin]
      summary: Activate as the store data source (applied on restart) — PLATFORM_ADMIN
      description: >-
        Activation requires a successful live probe, disables any previously
        active connection and writes the data-source override file read at
        startup. enabled=false deactivates the override globally.
      security:
        - bearerAuth: []
      parameters:
        - { name: databaseId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated connection state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteDatabase' }

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [Admin]
      summary: Every account with Infinia Level, status and roles — PLATFORM_ADMIN
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Accounts, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminUser' }

  /admin/users/{userId}:
    put:
      operationId: updateAdminUser
      tags: [Admin]
      summary: Adjust Infinia Level, status, roles or display name — PLATFORM_ADMIN
      description: >-
        Disabling an account revokes its live sessions immediately. Admins cannot
        disable themselves or drop their own PLATFORM_ADMIN role. All changes are audited.
      security:
        - bearerAuth: []
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminUserRequest' }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }

  /admin/listings/{listingId}/min-bee-level:
    post:
      operationId: setListingMinBeeLevel
      tags: [Admin]
      summary: Adjust the listing's Infinia Level gate (门槛) — PLATFORM_ADMIN
      security:
        - bearerAuth: []
      parameters:
        - { name: listingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minBeeLevel]
              properties:
                minBeeLevel: { type: integer, minimum: 0, maximum: 4 }
      responses:
        '200':
          description: Updated listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminListing' }

  /admin/reports:
    get:
      operationId: listReports
      tags: [Admin]
      summary: Abuse report queue — PLATFORM_ADMIN
      security:
        - bearerAuth: []
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [OPEN, ACTIONED, DISMISSED] } }
      responses:
        '200':
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Report' }

  /admin/reports/{reportId}/resolution:
    post:
      operationId: resolveReport
      tags: [Admin]
      summary: Resolve an abuse report — PLATFORM_ADMIN
      security:
        - bearerAuth: []
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveReportRequest' }
      responses:
        '200':
          description: Resolved report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }

  /admin/audit-events:
    get:
      operationId: listAuditEvents
      tags: [Admin]
      summary: Append-only audit trail reader — PLATFORM_ADMIN
      security:
        - bearerAuth: []
      parameters:
        - { name: resourceType, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: Audit events (newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }

  /admin/upstreams:
    get:
      operationId: listUpstreams
      tags: [Admin]
      summary: Aggregated upstream marketplaces — PLATFORM_ADMIN
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Upstream sources
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Upstream' }
    post:
      operationId: createUpstream
      tags: [Admin]
      summary: Register an upstream marketplace (e.g. the official Claude skills) for aggregation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUpstreamRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upstream' }

  /admin/upstreams/{upstreamId}/sync:
    post:
      operationId: syncUpstream
      tags: [Admin]
      summary: Aggregate the upstream now; imported skills run through the full publish pipeline
      security:
        - bearerAuth: []
      parameters:
        - { name: upstreamId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Sync summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamSyncResult' }

  /organizations:
    post:
      operationId: createOrganization
      tags: [Organizations]
      summary: Create an organization; reserves the matching namespace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
                name: { type: string, maxLength: 100 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }

  /organizations/{organizationId}/webhooks:
    get:
      operationId: listWebhooks
      tags: [Organizations]
      summary: List organization webhooks
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Webhooks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Webhook' }
    post:
      operationId: createWebhook
      tags: [Organizations]
      summary: Register a webhook for publishing / review / security events
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  items: { type: string }
                  example: [release.published, release.quarantined]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }

  /organizations/{organizationId}/members:
    get:
      operationId: listOrgMembers
      tags: [Organizations]
      summary: List organization members and their roles (membership required)
      security:
        - bearerAuth: []
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrganizationMember' }
    post:
      operationId: addOrgMember
      tags: [Organizations]
      summary: Add a member by account email — ORG_ADMIN
      security:
        - bearerAuth: []
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMemberRequest' }
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationMember' }

  /organizations/{organizationId}/members/{memberId}:
    delete:
      operationId: removeOrgMember
      tags: [Organizations]
      summary: Remove a member (the owner cannot be removed) — ORG_ADMIN
      security:
        - bearerAuth: []
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string } }
        - { name: memberId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Removed }

  /organizations/{organizationId}/members/{memberId}/role:
    put:
      operationId: changeOrgMemberRole
      tags: [Organizations]
      summary: Change a member's role (the owner's role is fixed) — ORG_ADMIN
      security:
        - bearerAuth: []
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string } }
        - { name: memberId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [USER, PUBLISHER, ORG_ADMIN, REVIEWER, PLATFORM_ADMIN] }
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationMember' }

  /organizations/{organizationId}/audit-events:
    get:
      operationId: listOrgAuditEvents
      tags: [Organizations]
      summary: Audit events touching this organization (membership required)
      security:
        - bearerAuth: []
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ProblemUnauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemForbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemNotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemConflict:
      description: Conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    ListingType:
      type: string
      enum: [APP, PLUGIN, SKILL, MCP, FLOW]
    Channel:
      type: string
      enum: [stable, beta, alpha, nightly, private]
    Platform:
      type: string
      enum: [windows, macos, linux, universal]
    Arch:
      type: string
      enum: [x64, arm64, universal]
    ArtifactKind:
      type: string
      enum: [PACKAGE, INSTALLER, PORTABLE, CHECKSUMS, SIGNATURE, SBOM]

    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string, description: Stable machine-readable code }
        detail: { type: string }
        traceId: { type: string }
        parameters:
          type: object
          additionalProperties: true

    CatalogItem:
      type: object
      required: [coordinate, type, namespace, slug, name]
      properties:
        coordinate: { type: string, example: 'infinia://plugin/official/markdown' }
        type: { $ref: '#/components/schemas/ListingType' }
        namespace: { type: string }
        slug: { type: string }
        name: { type: string }
        summary: { type: string }
        category: { type: string }
        tags: { type: array, items: { type: string } }
        iconUrl: { type: string, format: uri }
        latestVersion: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        downloads: { type: integer, format: int64 }
        publisherName: { type: string }
        updatedAt: { type: string, format: date-time }
        featured: { type: boolean, description: Editorial featuring (admin) }
        minBeeLevel: { type: integer, minimum: 0, maximum: 4, description: 'Infinia Level gate: 0 = public; 1..4 restricts view/download to accounts at or above that level' }

    CatalogPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CatalogItem' } }
        nextCursor: { type: string, nullable: true }
        totalEstimate: { type: integer, format: int64 }

    Localization:
      type: object
      properties:
        locale: { type: string, example: en }
        name: { type: string }
        summary: { type: string }
        descriptionMarkdown: { type: string }
        changelogMarkdown: { type: string }

    Artifact:
      type: object
      required: [artifactId, kind, platform, arch, filename, size]
      properties:
        artifactId: { type: string }
        kind: { $ref: '#/components/schemas/ArtifactKind' }
        platform: { $ref: '#/components/schemas/Platform' }
        arch: { $ref: '#/components/schemas/Arch' }
        variant: { type: string, description: APP build variant (lite, jre, uos, jar); default for non-APP artifacts }
        filename: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string, nullable: true, description: Absent for live upstream delivery }
        keyId: { type: string }
        mimeType: { type: string }

    Dependency:
      type: object
      properties:
        coordinate: { type: string }
        range: { type: string }
        optional: { type: boolean }

    Permission:
      type: object
      properties:
        permissionId: { type: string }
        scope: { type: string, example: network }
        required: { type: boolean }
        reason: { type: string }

    ListingRelease:
      type: object
      required: [releaseId, version, status, channel]
      properties:
        releaseId: { type: string }
        version: { type: string }
        status: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        requiresHost: { type: string }
        license: { type: string }
        sourceUrl: { type: string }
        changelogMarkdown: { type: string }
        rolloutPercent: { type: integer, minimum: 0, maximum: 100 }
        artifacts: { type: array, items: { $ref: '#/components/schemas/Artifact' } }
        dependencies: { type: array, items: { $ref: '#/components/schemas/Dependency' } }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }

    ListingDetail:
      type: object
      required: [listingId, coordinate, type, namespace, slug]
      properties:
        listingId: { type: string }
        coordinate: { type: string }
        type: { $ref: '#/components/schemas/ListingType' }
        namespace: { type: string }
        slug: { type: string }
        visibility: { type: string, enum: [PUBLIC, UNLISTED, PRIVATE] }
        status: { type: string }
        category: { type: string }
        tags: { type: array, items: { type: string } }
        iconUrl: { type: string, format: uri, nullable: true }
        screenshots: { type: array, items: { type: string, format: uri } }
        defaultChannel: { $ref: '#/components/schemas/Channel' }
        publisherName: { type: string }
        downloads: { type: integer, format: int64 }
        favorites: { type: integer, format: int64 }
        minBeeLevel: { type: integer, minimum: 0, maximum: 4, description: 'Infinia Level gate: 0 = public; 1..4 restricts view/download to accounts at or above that level' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        localizations: { type: array, items: { $ref: '#/components/schemas/Localization' } }
        releases: { type: array, items: { $ref: '#/components/schemas/ListingRelease' } }
        upstream: { $ref: '#/components/schemas/UpstreamProvenance' }

    UpstreamProvenance:
      type: object
      description: Metadata provenance for a live, non-retained upstream artifact.
      properties:
        sourceName: { type: string }
        externalId: { type: string }
        sourceUrl: { type: string, format: uri }
        sourcePath: { type: string }
        ref: { type: string }
        commitSha: { type: string }
        upstreamVersion: { type: string }
        metadataSha256: { type: string }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        deliveryMode: { type: string, enum: [LIVE_NO_RETENTION] }

    ClientEnvironment:
      type: object
      required: [hostVersion, os, arch]
      properties:
        hostVersion: { type: string }
        os: { $ref: '#/components/schemas/Platform' }
        arch: { $ref: '#/components/schemas/Arch' }
        channel: { $ref: '#/components/schemas/Channel' }
        installed:
          type: array
          items:
            type: object
            properties:
              coordinate: { type: string }
              version: { type: string }

    ResolveRequest:
      type: object
      required: [coordinate, client]
      properties:
        coordinate: { type: string, example: 'infinia://flow/summer/mail-digest' }
        range: { type: string, example: '>=1.0.0 <2.0.0' }
        client: { $ref: '#/components/schemas/ClientEnvironment' }

    ResolutionItem:
      type: object
      properties:
        coordinate: { type: string }
        releaseId: { type: string }
        version: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        artifacts: { type: array, items: { $ref: '#/components/schemas/Artifact' } }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        requiresHost: { type: string }
        alreadyInstalled: { type: boolean }
        reason: { type: string }

    MissingDependency:
      type: object
      properties:
        coordinate: { type: string }
        range: { type: string }
        reason: { type: string }

    ResolveResponse:
      type: object
      properties:
        resolvable: { type: boolean }
        rootCoordinate: { type: string }
        plan: { type: array, items: { $ref: '#/components/schemas/ResolutionItem' } }
        missing: { type: array, items: { $ref: '#/components/schemas/MissingDependency' } }
        resolvedAt: { type: string, format: date-time }

    DownloadTicket:
      type: object
      required: [releaseId, artifactId, url]
      properties:
        releaseId: { type: string }
        artifactId: { type: string }
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        sha256: { type: string, nullable: true, description: Absent for live upstream delivery }
        signature: { type: string }
        keyId: { type: string }
        size: { type: integer, format: int64 }

    AppUpdateArtifact:
      type: object
      properties:
        url: { type: string, format: uri }
        filename: { type: string }
        sha256: { type: string }
        signature: { type: string }
        keyId: { type: string }
        size: { type: integer, format: int64 }
        platform: { $ref: '#/components/schemas/Platform' }
        arch: { $ref: '#/components/schemas/Arch' }
        kind: { type: string, enum: [installer, portable] }
        variant: { type: string }
        mimeType: { type: string }

    AppUpdate:
      type: object
      properties:
        latestVersion: { type: string, nullable: true }
        mandatory: { type: boolean }
        rollout: { type: integer, minimum: 0, maximum: 100 }
        releaseNotes: { type: string }
        artifacts: { type: array, items: { $ref: '#/components/schemas/AppUpdateArtifact' } }
        sha256: { type: string }
        signature: { type: string }
        keyId: { type: string }
        publishedAt: { type: string, format: date-time }
        minimumSupportedVersion: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
        displayName: { type: string, minLength: 1, maxLength: 64 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, maxLength: 128 }

    LoginResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken: { type: string }
        user: { $ref: '#/components/schemas/PublicUser' }

    PublicUser:
      type: object
      required: [userId, email, displayName, roles]
      properties:
        userId: { type: string }
        email: { type: string }
        displayName: { type: string }
        roles: { type: array, items: { type: string } }
        beeLevel: { type: integer, minimum: 0, maximum: 4, description: 'Infinia Level position: 0 LARVA · 1 WORKER · 2 FORAGER · 3 GUARD · 4 QUEEN' }
        createdAt: { type: string, format: date-time }

    RemoteDatabase:
      type: object
      description: A registered remote database endpoint (远程数据库配置) — the sealed password is never returned.
      properties:
        databaseId: { type: string }
        name: { type: string }
        jdbcUrl: { type: string, example: 'jdbc:postgresql://db.example.com:5432/store' }
        username: { type: string }
        enabled: { type: boolean, description: True when active as the data-source override }
        lastTestedAt: { type: string, format: date-time, nullable: true }
        lastTestOk: { type: boolean, nullable: true }
        lastTestError: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateRemoteDatabaseRequest:
      type: object
      required: [name, jdbcUrl, username, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        jdbcUrl: { type: string, maxLength: 500, example: 'jdbc:postgresql://db.example.com:5432/store' }
        username: { type: string, minLength: 1, maxLength: 200 }
        password: { type: string, maxLength: 500, writeOnly: true }

    UpdateRemoteDatabaseRequest:
      type: object
      description: Partial update; a blank/absent password keeps the stored credential.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        jdbcUrl: { type: string, maxLength: 500 }
        username: { type: string, minLength: 1, maxLength: 200 }
        password: { type: string, maxLength: 500, writeOnly: true }

    RemoteDatabaseTestResult:
      type: object
      properties:
        ok: { type: boolean }
        productName: { type: string, nullable: true, example: PostgreSQL }
        productVersion: { type: string, nullable: true, example: '16.4' }
        testedAt: { type: string, format: date-time }
        error: { type: string, nullable: true }

    DataSourceStatus:
      type: object
      description: The data source the running instance uses right now.
      properties:
        productName: { type: string, nullable: true }
        productVersion: { type: string, nullable: true }
        url: { type: string, nullable: true, description: Password-masked JDBC URL }
        username: { type: string, nullable: true }
        remoteOverrideActive: { type: boolean, description: True when a remote database activated in the console is in effect }
        overrideName: { type: string, nullable: true }

    AdminUser:
      type: object
      description: Admin-console view of one account (user management).
      properties:
        userId: { type: string }
        email: { type: string }
        displayName: { type: string }
        roles: { type: array, items: { type: string } }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        beeLevel: { type: integer, minimum: 0, maximum: 4 }
        mfaEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time, nullable: true }

    UpdateAdminUserRequest:
      type: object
      description: Partial admin update; omitted fields keep their current values.
      properties:
        beeLevel: { type: integer, minimum: 0, maximum: 4 }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        roles: { type: array, items: { type: string }, description: Full replacement role list; USER is always kept }
        displayName: { type: string, minLength: 1, maxLength: 64 }

    Session:
      type: object
      properties:
        sessionId: { type: string }
        clientId: { type: string }
        kind: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        remoteIpHash: { type: string }

    Device:
      type: object
      properties:
        deviceId: { type: string }
        publicId: { type: string }
        name: { type: string }
        platform: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        revoked: { type: boolean }

    Favorite:
      type: object
      properties:
        listingCoordinate: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/ListingType' }
        latestVersion: { type: string }
        addedAt: { type: string, format: date-time }

    Entitlement:
      type: object
      properties:
        listingCoordinate: { type: string }
        free: { type: boolean }
        acquiredAt: { type: string, format: date-time }

    InstallEvent:
      type: object
      required: [idempotencyKey, coordinate, version, action, outcome]
      properties:
        idempotencyKey: { type: string, maxLength: 128 }
        coordinate: { type: string }
        version: { type: string }
        type: { $ref: '#/components/schemas/ListingType' }
        action: { type: string, enum: [install, update, rollback, uninstall] }
        outcome: { type: string, enum: [success, failure, rolled_back] }
        hostVersion: { type: string }
        os: { type: string }
        arch: { type: string }
        occurredAt: { type: string, format: date-time }

    Library:
      type: object
      properties:
        favorites: { type: array, items: { $ref: '#/components/schemas/Favorite' } }
        entitlements: { type: array, items: { $ref: '#/components/schemas/Entitlement' } }
        installHistory: { type: array, items: { $ref: '#/components/schemas/InstallEvent' } }

    CreateListingRequest:
      type: object
      required: [namespace, slug, type, name]
      properties:
        namespace: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        type: { $ref: '#/components/schemas/ListingType' }
        category: { type: string }
        tags: { type: array, items: { type: string } }
        defaultChannel: { $ref: '#/components/schemas/Channel' }
        name: { type: string, minLength: 1, maxLength: 100 }
        summary: { type: string, maxLength: 500 }
        descriptionMarkdown: { type: string, maxLength: 50000 }
        locale: { type: string, default: en }
        minBeeLevel: { type: integer, minimum: 0, maximum: 4, default: 0, description: 'Infinia Level gate the publisher sets: 0 = public; 1..4 = only signed-in accounts at or above that level may view and download' }

    CreateReleaseRequest:
      type: object
      required: [version, channel]
      properties:
        version: { type: string, example: 1.2.0 }
        channel: { $ref: '#/components/schemas/Channel' }
        requiresHost: { type: string, example: '>=4.0.0-beta.5 <5.0.0' }
        license: { type: string, example: MIT }
        sourceUrl: { type: string, format: uri }
        changelogMarkdown: { type: string, maxLength: 50000 }
        dependencies: { type: array, items: { $ref: '#/components/schemas/Dependency' } }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        rolloutPercent: { type: integer, minimum: 0, maximum: 100, default: 100 }

    UploadSession:
      type: object
      required: [uploadId, releaseId, uploadUrl, method]
      properties:
        uploadId: { type: string }
        releaseId: { type: string }
        filename: { type: string }
        kind: { $ref: '#/components/schemas/ArtifactKind' }
        platform: { $ref: '#/components/schemas/Platform' }
        arch: { $ref: '#/components/schemas/Arch' }
        variant: { type: string }
        uploadUrl: { type: string, format: uri }
        method: { type: string, enum: [PUT] }
        expiresAt: { type: string, format: date-time }
        maxSizeBytes: { type: integer, format: int64 }

    ScanFinding:
      type: object
      properties:
        severity: { type: string, enum: [INFO, WARN, ERROR, CRITICAL] }
        rule: { type: string }
        message: { type: string }

    SubmitResult:
      type: object
      properties:
        releaseId: { type: string }
        status: { type: string }
        reviewId: { type: string, nullable: true }
        submittedAt: { type: string, format: date-time }

    PublisherRelease:
      type: object
      required: [releaseId, listingCoordinate, version, status, channel]
      properties:
        releaseId: { type: string }
        listingCoordinate: { type: string }
        version: { type: string }
        status: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        createdAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time, nullable: true }
        artifacts: { type: array, items: { $ref: '#/components/schemas/Artifact' } }
        findings: { type: array, items: { $ref: '#/components/schemas/ScanFinding' } }

    Review:
      type: object
      required: [reviewId, releaseId, status]
      properties:
        reviewId: { type: string }
        releaseId: { type: string }
        listingCoordinate: { type: string }
        listingName: { type: string }
        version: { type: string }
        status: { type: string }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
        reviewerId: { type: string, nullable: true }
        notes: { type: string }
        findings: { type: array, items: { $ref: '#/components/schemas/ScanFinding' } }

    Organization:
      type: object
      properties:
        organizationId: { type: string }
        slug: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }

    Webhook:
      type: object
      properties:
        webhookId: { type: string }
        organizationId: { type: string }
        url: { type: string, format: uri }
        events: { type: array, items: { type: string } }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    Rating:
      type: object
      properties:
        ratingId: { type: string }
        userId: { type: string }
        stars: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        updatedAt: { type: string, format: date-time }

    RatingSummary:
      type: object
      properties:
        count: { type: integer, format: int64 }
        average: { type: number }

    RatingsPage:
      type: object
      properties:
        summary: { $ref: '#/components/schemas/RatingSummary' }
        ratings: { type: array, items: { $ref: '#/components/schemas/Rating' } }

    UpsertRatingRequest:
      type: object
      required: [stars]
      properties:
        stars: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 2000 }

    ReportRequest:
      type: object
      required: [coordinate, reason]
      properties:
        coordinate: { type: string, example: 'infinia://plugin/official/markdown' }
        reason: { type: string, enum: [malware, policy_violation, spam, misleading, license, other] }
        details: { type: string, maxLength: 2000 }

    Report:
      type: object
      properties:
        reportId: { type: string }
        listingCoordinate: { type: string }
        listingName: { type: string }
        reason: { type: string }
        details: { type: string }
        status: { type: string, enum: [OPEN, ACTIONED, DISMISSED] }
        resolutionNote: { type: string }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }

    ResolveReportRequest:
      type: object
      required: [resolution]
      properties:
        resolution: { type: string, enum: [ACTIONED, DISMISSED] }
        note: { type: string, maxLength: 1000 }

    AuditEvent:
      type: object
      properties:
        eventId: { type: string }
        actorType: { type: string }
        actorId: { type: string }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        beforeSummary: { type: string }
        afterSummary: { type: string }
        traceId: { type: string }
        occurredAt: { type: string, format: date-time }

    OrganizationMember:
      type: object
      properties:
        userId: { type: string }
        email: { type: string }
        displayName: { type: string }
        role: { type: string }
        joinedAt: { type: string, format: date-time }
        owner: { type: boolean }

    AddMemberRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [USER, PUBLISHER, ORG_ADMIN] , default: PUBLISHER }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 128 }
        newPassword: { type: string, minLength: 8, maxLength: 128 }

    ChangePasswordResult:
      type: object
      properties:
        succeeded: { type: boolean }
        message: { type: string }

    InstalledItem:
      type: object
      properties:
        coordinate: { type: string }
        version: { type: string }
        type: { type: string }
        latestVersion: { type: string, nullable: true }
        latestChannel: { type: string, nullable: true }
        updateAvailable: { type: boolean }

    AdminListing:
      type: object
      properties:
        listingId: { type: string }
        coordinate: { type: string }
        name: { type: string }
        type: { type: string }
        status: { type: string }
        visibility: { type: string, enum: [PUBLIC, UNLISTED, PRIVATE] }
        latestVersion: { type: string, nullable: true }
        featured: { type: boolean }
        minBeeLevel: { type: integer, minimum: 0, maximum: 4 }
        downloads: { type: integer, format: int64 }

    AdminAppUploadStart:
      type: object
      required: [filename]
      properties:
        version: { type: string, description: SemVer of the update package — inferred from the filename when omitted }
        channel: { type: string, enum: [stable, beta, alpha, nightly], description: Inferred from the version's pre-release suffix when omitted }
        changelog: { type: string, description: Optional release notes }
        filename: { type: string, description: Package filename — version/channel/kind/platform/arch/variant are inferred from it }
        size: { type: integer, format: int64, description: Declared byte size }

    AdminAppUploadSession:
      type: object
      required: [releaseId, version, uploadUrl, method]
      properties:
        listingId: { type: string }
        releaseId: { type: string }
        version: { type: string, description: The (possibly inferred) release version }
        channel: { type: string, description: The (possibly inferred) release channel }
        uploadUrl: { type: string, description: Server-relative presigned PUT URL }
        method: { type: string, enum: [PUT] }
        kind: { type: string }
        platform: { type: string }
        arch: { type: string }
        variant: { type: string }
        expiresAt: { type: string }

    AdminAppArtifact:
      type: object
      properties:
        filename: { type: string }
        kind: { type: string }
        platform: { type: string }
        arch: { type: string }
        variant: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string }

    AdminAppRelease:
      type: object
      properties:
        releaseId: { type: string }
        version: { type: string }
        channel: { type: string }
        status: { type: string }
        publishedAt: { type: string, nullable: true }
        artifacts:
          type: array
          items: { $ref: '#/components/schemas/AdminAppArtifact' }

    Upstream:
      type: object
      properties:
        upstreamId: { type: string }
        name: { type: string }
        marketplaceUrl: { type: string, format: uri }
        targetNamespace: { type: string }
        adapterType: { type: string, enum: [AUTO, CLAUDE_MARKETPLACE, SKILL_REPOSITORY, MCP_REGISTRY, SKILLHUB_REGISTRY] }
        enabled: { type: boolean }
        lastSyncAt: { type: string, format: date-time, nullable: true }
        lastSyncOk: { type: boolean, nullable: true }
        lastError: { type: string, nullable: true }

    CreateUpstreamRequest:
      type: object
      required: [name, marketplaceUrl, targetNamespace]
      properties:
        name: { type: string, maxLength: 100 }
        marketplaceUrl: { type: string, format: uri }
        targetNamespace: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        adapterType: { type: string, enum: [AUTO, CLAUDE_MARKETPLACE, SKILL_REPOSITORY, MCP_REGISTRY, SKILLHUB_REGISTRY] }

    UpstreamSyncResult:
      type: object
      properties:
        upstream: { type: string }
        imported: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }
        errors: { type: array, items: { type: string } }

    FengYuCatalogEntry:
      type: object
      description: Field names mirror the FengYu host's MarketplaceCatalogEntry contract.
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: string }
        author: { type: string }
        icon: { type: string, format: uri, nullable: true }
        category: { type: string }
        permissions: { type: array, items: { type: string } }
        homepage: { type: string, nullable: true }
        downloadUrl: { type: string, description: Direct HMAC-ticketed package URL }
        official: { type: boolean }
        sha256: { type: string }
        signature: { type: string, nullable: true }
        keyId: { type: string, nullable: true }
