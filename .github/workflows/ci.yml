name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Maven, Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build & test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'

  frontend:
    name: Frontend (Yarn 4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Regenerate API types (drift check)
        run: |
          yarn workspace @infinia/store-web gen:api
          git diff --exit-code -- store-web/src/api/schema.d.ts
      - name: Unit tests (magic-ui port)
        run: yarn ui:test
      - name: Unit tests (store web)
        run: yarn web:test
      - name: Typecheck & build
        run: yarn web:build
