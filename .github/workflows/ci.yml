name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Maven, Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build & test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'

  frontend:
    name: Frontend (Yarn 4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Regenerate API types (drift check)
        run: |
          yarn workspace @infinia/store-web gen:api
          git diff --exit-code -- store-web/src/api/schema.d.ts
      - name: Unit tests (magic-ui port)
        run: yarn ui:test
      - name: Unit tests (store web)
        run: yarn web:test
      - name: Unit tests (monitor web)
        run: yarn monitor:test
      - name: Typecheck & build (store web)
        run: yarn web:build
      - name: Typecheck & build (monitor web)
        run: yarn monitor:build
      - name: Monitor jar embeds its SPA
        run: ./build-monitor-jar.sh --skip-tests --skip-web

  images:
    name: Images (Docker → GHCR)
    runs-on: ubuntu-latest
    # Never publish release images from a commit whose tests are red.
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # GHCR image names must be lowercase; github.repository keeps its case.
      - name: Lowercase repo name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Store image (builds SPA + jar inside; PRs build-only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Monitor image (builds SPA + jar inside; PRs build-only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.monitor
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}-monitor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
