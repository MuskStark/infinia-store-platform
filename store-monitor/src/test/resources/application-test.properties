# Test override: never touch the operator's real ~/.infinia-monitor mirror.
spring.datasource.url=jdbc:h2:mem:monitor-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
monitor.mirror-dir=${java.io.tmpdir}/infinia-monitor-test
