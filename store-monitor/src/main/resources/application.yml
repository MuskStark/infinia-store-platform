spring:
  application:
    name: infinia-monitor
  datasource:
    url: jdbc:h2:file:${monitor.mirror-dir}/monitor-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8090
  # Same proxy-chain rule as the store: honor X-Forwarded-* only when the
  # peer is a trusted internal proxy (see store-application's application.yml).
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health

# One root setting: the store's public address. Every probe target and the
# mirrored status API derive from it — re-point the monitor by changing
# MONITOR_TARGET_BASE_URL and restarting (ADR-011 decision: no hot reload).
monitor:
  target-base-url: ${MONITOR_TARGET_BASE_URL:http://localhost:8080}
  poll-interval-ms: ${MONITOR_POLL_INTERVAL_MS:60000}
  probe-timeout-ms: ${MONITOR_PROBE_TIMEOUT_MS:8000}
  mirror-dir: ${MONITOR_MIRROR_DIR:${user.home}/.infinia-monitor}
  # Empty by default: alerting is opt-in per deployment.
  alert-webhook: ${MONITOR_ALERT_WEBHOOK:}
  alert-throttle-minutes: ${MONITOR_ALERT_THROTTLE_MINUTES:15}
  stale-after-ms: ${MONITOR_STALE_AFTER_MS:180000}
  history-days: ${MONITOR_HISTORY_DAYS:90}
